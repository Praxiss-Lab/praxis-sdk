---
name: Documentation

on:
    push:
        branches:
            - documentation
    pull_request:
        branches:
            - documentation
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
            - name: Install MkDocs Material
              run: python -m pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.6,<10'
            - name: Build site
              env:
                  NO_MKDOCS_2_WARNING: '1'
              run: mkdocs build --strict
            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: site

    deploy:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/documentation'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
