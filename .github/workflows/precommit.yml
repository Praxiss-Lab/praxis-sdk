---
# .github/workflows/precommit.yml
name: Pre-commit checks

on:
    workflow_call:

jobs:
    pre-commit:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

            - name: Install dependencies
              run: uv sync --frozen --group dev

            - name: Ensure dynamic attribute baseline only shrinks
              run: |
                  uv run python scripts/check_forbidden_dynamic_attributes.py \
                    --baseline-ref ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}

            - name: Run pre-commit (all files)
              run: uv run pre-commit run --all-files --show-diff-on-failure
        timeout-minutes: 30
permissions:
    contents: read
