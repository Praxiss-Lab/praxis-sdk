---
name: Create Version Bump PRs

on:
    # Dispatched by pypi-release.yml after a successful publish.
    # Also supports manual reruns for a specific version.
    workflow_dispatch:
        inputs:
            version:
                description: Version to bump to (e.g., 1.11.3)
                required: true
                type: string

jobs:
    bump-typescript-client:
        # Open a PR in this repository bumping the TypeScript client's pinned
        # agent-server image and generated contract to this SDK release.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ secrets.PRAXIS_AUTOMATION_TOKEN }}
        steps:
            - name: Checkout SDK release tooling
              uses: actions/checkout@v7.0.1
              with:
                  # The default GITHUB_TOKEN cannot push the bump branch.
                  token: ${{ secrets.PRAXIS_AUTOMATION_TOKEN }}

                  persist-credentials: false
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: clients/typescript/package-lock.json

            - name: Get version
              id: get_version
              env:
                  VERSION_INPUT: ${{ github.event.inputs.version }}
              run: |
                  VERSION="$VERSION_INPUT"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.30.0)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "📦 Version: $VERSION"

            - name: Wait for agent-server image in GHCR
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail
                  IMAGE="ghcr.io/openhands/agent-server:${VERSION}-python"
                  for ATTEMPT in $(seq 1 90); do
                    if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                      echo "✅ ${IMAGE} is published"
                      exit 0
                    fi
                    echo "Attempt $ATTEMPT/90: waiting 30s for ${IMAGE}"
                    sleep 30
                  done
                  echo "❌ Timeout waiting for ${IMAGE}"
                  exit 1

            - name: Obtain exact OpenAPI release artifact
              id: openapi
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  set -euo pipefail
                  ARTIFACT_DIR="$RUNNER_TEMP/agent-server-$VERSION-openapi"
                  OPENAPI_PATH="$ARTIFACT_DIR/openapi.json"
                  mkdir -p "$ARTIFACT_DIR"
                  for ATTEMPT in $(seq 1 90); do
                    if gh release download "v$VERSION" \
                      --repo "${{ github.repository }}" \
                      --pattern openapi.json \
                      --dir "$ARTIFACT_DIR" \
                      --clobber > /dev/null 2>&1; then
                      jq -e --arg version "$VERSION" \
                        '.info.version == $version' "$OPENAPI_PATH" > /dev/null
                      echo "path=$OPENAPI_PATH" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    echo "Attempt $ATTEMPT/90: waiting 20s for openapi.json"
                    sleep 20
                  done
                  echo "❌ Timeout waiting for SDK release v${VERSION} openapi.json"
                  exit 1

            - name: Open TypeScript client bump PR
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  OPENAPI_PATH: ${{ steps.openapi.outputs.path }}
              run: |
                  set -euo pipefail
                  REPO="${{ github.repository }}"
                  BRANCH="bump-typescript-agent-server-$VERSION"
                  CLIENT_ROOT="clients/typescript"
                  BEFORE_SCHEMA="$RUNNER_TEMP/agent-server-schema-before.ts"
                  API_SUMMARY="$RUNNER_TEMP/agent-server-api-summary.md"

                  git fetch origin main
                  git checkout -B "$BRANCH" origin/main
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  CURRENT=$(node -p "require('./$CLIENT_ROOT/package.json').config.agentServerImage.match(/agent-server:([0-9.]+)-python/)[1]")
                  if [ "$CURRENT" = "$VERSION" ]; then
                    echo "✅ TypeScript client already pinned to $VERSION"
                    exit 0
                  fi

                  cp "$CLIENT_ROOT/src/generated/agent-server-schema.ts" "$BEFORE_SCHEMA"
                  npm ci --prefix "$CLIENT_ROOT"
                  python .github/scripts/prepare_typescript_client_agent_server_bump.py \
                    --client-root "$CLIENT_ROOT" \
                    --version "$VERSION" \
                    --openapi "$OPENAPI_PATH"
                  (
                    cd "$CLIENT_ROOT"
                    AGENT_SERVER_OPENAPI_PATH="$OPENAPI_PATH" npm run generate:agent-server-api
                    npm run summarize:agent-server-api -- \
                      --before "$BEFORE_SCHEMA" \
                      --after src/generated/agent-server-schema.ts \
                      --output "$API_SUMMARY"
                  )

                  if git diff --quiet; then
                    echo "⚠️ No changes produced"
                    exit 0
                  fi

                  git add "$CLIENT_ROOT/package.json" "$CLIENT_ROOT/AGENTS.md" \
                    "$CLIENT_ROOT/README.md" "$CLIENT_ROOT/src/generated/agent-server-schema.ts"
                  git commit -m "chore(typescript): agent-server to v$VERSION"
                  git push --force-with-lease -u origin "$BRANCH"

                  EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "✅ PR #$EXISTING_PR already exists"
                    exit 0
                  fi

                  cat > "$RUNNER_TEMP/pr_body.md" <<EOF
                  ## Bump tracked Agent Server version

                  Updates `clients/typescript` from Agent Server v${CURRENT} to v${VERSION} and regenerates its checked-in OpenAPI contract.

                  ## Agent Server API change summary

                  $(cat "$API_SUMMARY")

                  Triggered by https://github.com/OpenHands/software-agent-sdk/releases/tag/v${VERSION}.
                  EOF
                  gh pr create --repo "$REPO" --base main --head "$BRANCH" \
                    --title "chore(typescript): agent-server to v$VERSION" \
                    --body-file "$RUNNER_TEMP/pr_body.md"

            - name: Summary
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  echo "TypeScript client bump: https://github.com/${{ github.repository }}/pulls?q=is%3Apr+bump-typescript-agent-server-$VERSION" >> "$GITHUB_STEP_SUMMARY"

        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (true)
