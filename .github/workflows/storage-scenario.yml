---
name: Storage scenario

on:
    workflow_call:

permissions:
    contents: read
jobs:
    storage-scenario:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Build current agent-server image
              run: >-
                  docker build --target source -t ghcr.io/praxiss-lab/praxis-agent-server:latest-python
                  -f praxis-agent-server/openhands/agent_server/docker/Dockerfile .

            - name: Run storage scenario
              run: uv run pytest -m docker_live tests/agent_server/docker_runtime/test_storage_scenario.py
        timeout-minutes: 30
