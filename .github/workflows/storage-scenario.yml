---
name: Storage scenario

on:
    workflow_call:

permissions:
    contents: read
jobs:
    storage-scenario:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

              with:
                  persist-credentials: false
            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: true
                  python-version: '3.13'

            - name: Install deps
              run: uv sync --frozen --group dev

            - name: Pull agent-server image
              run: docker pull ghcr.io/openhands/agent-server:latest-python

            - name: Run storage scenario
              run: uv run pytest -m docker_live tests/agent_server/docker_runtime/test_storage_scenario.py
        timeout-minutes: 30
