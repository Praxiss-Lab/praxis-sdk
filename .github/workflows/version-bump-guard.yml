---
name: Version bump guard

on:
    workflow_call:

jobs:
    version-bump-guard:
        name: Check package versions
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

                  persist-credentials: false
            - name: Validate package version changes
              id: version_changes
              env:
                  VERSION_BUMP_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^'
                      }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: python3 .github/scripts/check_version_bumps.py

            - name: Install uv
              if: steps.version_changes.outputs.versions_changed == 'true'
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: true

            - name: Install workspace dependencies
              if: steps.version_changes.outputs.versions_changed == 'true'
              run: uv sync --frozen --group dev

            - name: Check Python API compatibility
              if: steps.version_changes.outputs.versions_changed == 'true'
              env:
                  ACP_VERSION_CHECK_BASE_REF: |-
                      ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
                  ACP_VERSION_CHECK_SKIP: ${{ contains(github.event.pull_request.body || '', 'skip-acp-check') }}
              run: uv run python .github/scripts/check_sdk_api_breakage.py
        timeout-minutes: 30
permissions:
    contents: read
