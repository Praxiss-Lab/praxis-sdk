---
name: Example catalog coverage

on:
    workflow_call:

permissions:
    contents: read
jobs:
    check-examples:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout agent-sdk repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

                  persist-credentials: false
            - name: Checkout documentation branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: documentation
                  path: documentation
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Check documented examples
              env:
                  DOCS_PATH: ${{ github.workspace }}/documentation/docs
              shell: bash
              run: |
                  set -euo pipefail
                  python .github/scripts/check_documented_examples.py
        timeout-minutes: 30
