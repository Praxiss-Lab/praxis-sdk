---
# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # GitHub Actions
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: 06:00
      commit-message:
          prefix: chore(deps)

    # Python (uv) — workspace support landed in dependabot-core v0.374.0
    # (https://github.com/dependabot/dependabot-core/pull/14627, May 2026).
      open-pull-requests-limit: 1
      groups:
          version-updates:
              applies-to: version-updates
              patterns:
                  - '*'
          security-updates:
              applies-to: security-updates
              patterns:
                  - '*'
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
          day: tuesday
          time: 06:00
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore(deps)

      open-pull-requests-limit: 1
      groups:
          version-updates:
              applies-to: version-updates
              patterns:
                  - '*'
          security-updates:
              applies-to: security-updates
              patterns:
                  - '*'
    - package-ecosystem: npm
      directory: /clients/typescript
      schedule:
          interval: weekly
          day: wednesday
          time: 06:00
      commit-message:
          prefix: chore(deps)
      open-pull-requests-limit: 1
      groups:
          version-updates:
              applies-to: version-updates
              patterns:
                  - '*'
          security-updates:
              applies-to: security-updates
              patterns:
                  - '*'
