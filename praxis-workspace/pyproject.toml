[project]
name = "praxis-workspace"
version = "1.54.0"
description = "Praxis Workspace - Docker and container-based workspace implementations"

requires-python = ">=3.12"
dependencies = [
    "praxis-sdk",
    "praxis-agent-server",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
# AgentSandboxWorkspace: run the agent server in a kubernetes-sigs/agent-sandbox pod.
agent-sandbox = [
    "k8s-agent-sandbox>=1.0.4",
]

[project.urls]
Source = "https://github.com/Praxiss-Lab/praxis-sdk"
Homepage = "https://github.com/Praxiss-Lab/praxis-sdk"
Documentation = "https://github.com/Praxiss-Lab/praxis-sdk/tree/main/docs"
"Bug Tracker" = "https://github.com/Praxiss-Lab/praxis-sdk/issues"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.workspace*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
