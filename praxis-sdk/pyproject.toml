[project]
name = "praxis-sdk"
version = "1.54.0"
description = "Praxis SDK - Core functionality for building AI agents"

requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13.0",  # 0.11.0 reordered prompt() args, broke the client (#4830)
    "deprecation>=2.1.0",
    "fakeredis[lua]>=2.39.0",  # Explicit dependency for docket/fastmcp background tasks
    # 3.2.0 reads back the stored absolute OAuth token expiry; 4.x requires
    # mcp>=2, which browser-use 0.11.x cannot use (#5152)
    "fastmcp>=3.2.0,<4",
    "filelock>=3.20.1",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.23.0",
    "joserfc>=1.7.5",
    "litellm>=1.93.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-frontmatter>=1.3.0",
    "python-json-logger>=4.2.0",
    "tenacity>=9.1.2",
    "websockets>=12",
    "lmnr>=0.7.60,<0.8.0",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.urls]
Source = "https://github.com/Praxiss-Lab/praxis-sdk"
Homepage = "https://github.com/Praxiss-Lab/praxis-sdk"
Documentation = "https://github.com/Praxiss-Lab/praxis-sdk/tree/main/docs"
"Bug Tracker" = "https://github.com/Praxiss-Lab/praxis-sdk/issues"

[project.optional-dependencies]
boto3 = ["boto3>=1.35.0"]
toolshield = ["toolshield>=0.1.3,<0.2"]
vertex = ["google-cloud-aiplatform>=2.1.3"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["openhands.sdk*", "praxis*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi", "*.j2", "schemas/*.json", "skills/*.tgz"]
